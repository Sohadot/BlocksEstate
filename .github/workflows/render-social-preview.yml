name: Render social preview

on:
  push:
    branches: ["feat/social-preview-og-20261108"]
    paths:
      - social-preview.svg
      - scripts/render-social-preview.mjs
      - .github/workflows/render-social-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install rasterizer
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Render 1200x630 JPEG
        run: node scripts/render-social-preview.mjs
      - name: Commit image only to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets: render 1200x630 social preview"
            git push origin HEAD:feat/social-preview-og-20261108
          fi
